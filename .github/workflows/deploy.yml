# Type-checks, builds the image, pushes it to Docker Hub tagged with the commit SHA,
# then pins that tag in kubernetes/deployment.yaml. ArgoCD sees the git
# change and rolls out the new version.
#
# Required repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "kubernetes/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: prateeksavanur/portfolio

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the updated image tag back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://prateeksavanur.dev
            NEXT_PUBLIC_AUTHOR_NAME=Prateek Prasanna Savanur
            NEXT_PUBLIC_AUTHOR_HANDLE=TheTerminalGuyX
            NEXT_PUBLIC_GITHUB_URL=https://github.com/PrateekSavanur
            NEXT_PUBLIC_LINKEDIN_URL=https://linkedin.com/in/prateeksavanur
            NEXT_PUBLIC_SITE_DESCRIPTION=DevOps engineer. Building infrastructure, automating everything.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin new image tag in kubernetes/deployment.yaml
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_SHA}|" kubernetes/deployment.yaml
          grep -n "image:" kubernetes/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: deploy ${IMAGE}:${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
