apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: prateeksavanur/portfolio:2759be4adf1fe569a122af9e484f6d195e8adf3d
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"